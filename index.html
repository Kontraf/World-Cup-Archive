<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Archive (2002 - 2026)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
        }

        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px auto;
            flex-wrap: wrap;
            max-width: 800px;
            padding: 0 15px;
        }

        .filter-btn {
            background-color: #1e293b;
            color: #f8fafc;
            border: 2px solid #334155;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .container {
            max-width: 850px;
            margin: 0 auto 50px auto;
            padding: 0 15px;
        }

        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .match-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }

        .match-card:hover {
            transform: scale(1.01);
        }

        .match-info {
            font-size: 0.85rem;
            color: #94a3b8;
            min-width: 100px;
        }

        .match-year {
            background-color: #334155;
            padding: 3px 8px;
            border-radius: 4px;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 5px;
            display: inline-block;
        }

        .teams-display {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-grow: 1;
            justify-content: center;
        }

        .team-container {
            width: 220px;
            display: flex;
            flex-direction: column;
        }

        .team-container.left {
            text-align: right;
            align-items: flex-end;
        }

        .team-container.right {
            text-align: left;
            align-items: flex-start;
        }

        .team-name {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .scorers {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 5px;
            font-style: italic;
            max-width: 200px;
        }

        .score-display {
            font-size: 1.5rem;
            font-weight: 800;
            color: #f59e0b;
            background-color: #0f172a;
            padding: 5px 15px;
            border-radius: 8px;
            min-width: 80px;
            text-align: center;
        }

        /* 📱 ΕΙΔΙΚΟΣ ΣΧΕΔΙΑΣΜΟΣ ΓΙΑ ΚΙΝΗΤΑ (Κάτω από 768px) */
        @media (max-width: 768px) {
            .match-card {
                flex-direction: column;
                text-align: center;
                padding: 15px;
            }

            .match-info {
                margin-bottom: 15px;
                text-align: center;
            }

            .teams-display {
                flex-direction: column;
                gap: 10px;
                width: 100%;
            }

            .team-container {
                width: 100%;
            }

            .team-container.left, 
            .team-container.right {
                text-align: center;
                align-items: center;
            }

            .score-display {
                margin: 5px 0;
                width: auto;
                padding: 5px 25px;
            }
            
            .scorers {
                max-width: 100%;
            }
        }
    </style>
</head>

        function displayMatches(matches) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';

            if (matches.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8;">Δεν βρέθηκαν αγώνες.</p>';
                return;
            }

            matches.forEach(match => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <div class="match-info">
                        <span class="match-year">${match.year}</span>
                        <div>${match.stage}</div>
                    </div>
                    <div class="teams-display">
                        <div class="team-container left">
                            <span class="team-name">${match.team1}</span>
                            <span class="scorers">${match.scorers1}</span>
                        </div>
                        <span class="score-display">${match.score}</span>
                        <div class="team-container right">
                            <span class="team-name">${match.team2}</span>
                            <span class="scorers">${match.scorers2}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterMatches(year) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (year === 'all') {
                displayMatches(matchesData);
            } else {
                const filtered = matchesData.filter(match => match.year === year);
                displayMatches(filtered);
            }
        }

        displayMatches(matchesData);
    </script>

</html>
